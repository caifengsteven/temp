# LSTM-BEKK Trading System Configuration

# Data Configuration
data:
  # Bloomberg data settings
  bloomberg:
    start_date: "2019-01-01"
    end_date: "2024-01-01"
    
  # Stock universes
  universes:
    sp500_sample:
      - "AAPL US Equity"
      - "MSFT US Equity"
      - "GOOGL US Equity"
      - "AMZN US Equity"
      - "TSLA US Equity"
      - "META US Equity"
      - "NVDA US Equity"
      - "JPM US Equity"
      - "JNJ US Equity"
      - "V US Equity"
      - "PG US Equity"
      - "UNH US Equity"
      - "HD US Equity"
      - "MA US Equity"
      - "BAC US Equity"
      - "DIS US Equity"
      - "ADBE US Equity"
      - "CRM US Equity"
      - "NFLX US Equity"
      - "XOM US Equity"
      
    ftse100_sample:
      - "SHEL LN Equity"
      - "AZN LN Equity"
      - "ULVR LN Equity"
      - "LSEG LN Equity"
      - "BP/ LN Equity"
      - "HSBA LN Equity"
      - "RIO LN Equity"
      - "VOD LN Equity"
      - "BT/A LN Equity"
      - "GLEN LN Equity"
      
    nikkei_sample:
      - "7203 JP Equity"  # Toyota
      - "6758 JP Equity"  # Sony
      - "9984 JP Equity"  # SoftBank
      - "6861 JP Equity"  # Keyence
      - "8306 JP Equity"  # MUFG
      - "9432 JP Equity"  # NTT
      - "4063 JP Equity"  # Shin-Etsu Chemical
      - "6098 JP Equity"  # Recruit
      - "8035 JP Equity"  # Tokyo Electron
      - "7974 JP Equity"  # Nintendo

# Model Configuration
model:
  lstm_bekk:
    # LSTM parameters
    hidden_size: 64
    num_layers: 3
    dropout: 0.2
    
    # BEKK parameters
    max_iterations: 1000
    tolerance: 1e-6
    learning_rate: 0.001
    
    # Constraints
    min_eigenvalue: 1e-6
    max_condition_number: 1e6
    
    # Training parameters
    batch_size: 32
    epochs: 100
    validation_split: 0.2
    early_stopping_patience: 10

# Trading Configuration
trading:
  # Portfolio settings
  portfolio:
    initial_capital: 1000000  # $1M
    max_position_size: 0.1    # 10% max per asset
    min_position_size: 0.01   # 1% min per asset
    rebalance_frequency: 5    # days
    
  # Risk management
  risk:
    max_portfolio_volatility: 0.15  # 15% annual
    var_confidence: 0.05             # 5% VaR
    es_confidence: 0.01              # 1% Expected Shortfall
    max_drawdown_limit: 0.20         # 20% max drawdown
    
  # Strategy parameters
  strategies:
    gmv:
      enabled: true
      lookback_window: 252  # 1 year
      min_assets: 10
      
    volatility_sizing:
      enabled: true
      target_volatility: 0.12  # 12% annual
      lookback_window: 63       # 3 months
      
    correlation_breakdown:
      enabled: true
      threshold: 2.0            # 2 standard deviations
      lookback_window: 126      # 6 months
      min_correlation: 0.3

# Backtesting Configuration
backtesting:
  train_ratio: 0.7
  validation_ratio: 0.15
  test_ratio: 0.15
  walk_forward: true
  refit_frequency: 63  # days

# Logging Configuration
logging:
  level: "INFO"
  format: "{time:YYYY-MM-DD HH:mm:ss} | {level} | {name} | {message}"
  file: "logs/lstm_bekk_trading.log"
  rotation: "1 week"
  retention: "1 month"
