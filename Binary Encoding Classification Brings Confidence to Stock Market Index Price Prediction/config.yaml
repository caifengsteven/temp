# CUBIC Framework Configuration

# Data Configuration
data:
  # Bloomberg Terminal settings
  bloomberg:
    timeout: 30000  # milliseconds
    max_retries: 3
  
  # Index configurations
  indices:
    SPX:
      name: "S&P 500"
      bloomberg_ticker: "SPX Index"
      constituent_count: 500
    HSI:
      name: "Hang Seng Index"
      bloomberg_ticker: "HSI Index"
      constituent_count: 80
    SX5E:
      name: "Euro Stoxx 50"
      bloomberg_ticker: "SX5E Index"
      constituent_count: 50
  
  # Date range for data collection
  date_range:
    start_date: "2010-01-01"
    end_date: "2024-12-31"
  
  # Technical indicators configuration
  technical_indicators:
    lookback_window: 5
    sma_periods: [5, 10, 20]
    ema_periods: [5, 10, 20]
    rsi_period: 14
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    atr_period: 14
    bb_period: 20
    bb_std: 2
    adx_period: 14
    mfi_period: 14

# Model Configuration
model:
  # Binary encoding settings
  binary_encoding:
    precision_bits: 15
    value_range: [-1, 1]
  
  # Embedding dimensions
  embedding:
    stock_embedding_dim: 32
    hidden_dim: 128
  
  # Architecture settings
  architectures:
    lstm:
      num_layers: 2
      hidden_size: 128
      dropout: 0.1
    transformer:
      d_model: 64
      nhead: 8
      num_layers: 1
      dim_feedforward: 256
      dropout: 0.1
    mlp:
      hidden_layers: [256, 128, 64]
      dropout: 0.1

# Training Configuration
training:
  batch_size: 32
  learning_rate: 0.001
  num_epochs: 100
  weight_decay: 1e-5
  early_stopping_patience: 10
  
  # Data split ratios
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  
  # Confidence loss weights
  confidence_weight: 0.1

# Trading Configuration
trading:
  transaction_cost: 0.001  # 0.1%
  confidence_thresholds:
    low: 0.5
    medium: 0.7
    high: 0.9
  position_sizes:
    low_confidence: 0.5
    medium_confidence: 0.75
    high_confidence: 1.0

# Evaluation Configuration
evaluation:
  metrics:
    - "IC"  # Information Coefficient
    - "ICLR"  # Information Coefficient to Loss Ratio
    - "DA"  # Direction Accuracy
    - "SR"  # Sharpe Ratio
    - "AR"  # Annualized Return
  
  # Backtesting settings
  backtesting:
    initial_capital: 100000
    rebalance_frequency: "daily"

# Logging Configuration
logging:
  level: "INFO"
  save_logs: true
  log_dir: "logs"
  
# Output Configuration
output:
  save_models: true
  model_dir: "models"
  results_dir: "results"
  plots_dir: "plots"
